services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    env_file: .env             # contraseñas: ver .env.example
    environment:
      POSTGRES_DB: radius
      POSTGRES_USER: postgres
    # Usar nuestro pg_hba.conf en lugar del de la imagen (que acepta cualquier IP)
    command: postgres -c hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - "10.10.10.20:5432:5432"   # publicado solo en la IP de gestión
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro    # corre solo con el volumen vacío
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - pgdata:/var/lib/postgresql/data
    networks: [interna]

  # Métricas de PostgreSQL para Prometheus (VM grafana). Entra a la base por la
  # red interna de Docker con el usuario exporter (pg_monitor, solo lectura).
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    container_name: postgres-exporter
    restart: unless-stopped
    depends_on: [postgres]
    environment:
      DATA_SOURCE_URI: "postgres:5432/radius?sslmode=disable"
      DATA_SOURCE_USER: exporter
      DATA_SOURCE_PASS: ${EXPORTER_DB_PASSWORD}   # de db/.env
    command:
      - --extend.query-path=/etc/postgres-exporter/queries.yml   # SLI 3 y 4 (ver archivo)
      - --collector.long_running_transactions
    ports:
      - "10.10.10.20:9187:9187"   # solo en gestion
    volumes:
      - ./exporter/queries.yml:/etc/postgres-exporter/queries.yml:ro
    networks: [interna]

  # Recursos de la VM (sobre todo disco: es donde crece radacct). Lo lee Prometheus.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=10.10.10.20:9100   # solo en gestion
      # /vagrant es la carpeta compartida con la computadora (no el disco de la VM) y Vagrant
      # la monta dos veces: sin esto node-exporter da error en cada consulta (bitácora 26/11).
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run/credentials/.+|sys|vagrant|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)
    volumes:
      - /:/host:ro,rslave

  # Logs de esta VM (contenedores y sistema) hacia Loki. Lee el journal en solo
  # lectura, sin socket de Docker. Config compartida: alloy/journal.alloy.
  alloy:
    image: grafana/alloy:v1.21.3
    container_name: alloy
    restart: unless-stopped
    user: "473:473"            # usuario alloy de la imagen, no root
    group_add: ["999"]         # systemd-journal en Debian: permiso para leer el journal
    environment:
      INSTANCE: db           # mismas etiquetas que en Prometheus
      SERVICE: db
    command:
      - run
      - /etc/alloy/isp-radius   # solo nuestra config (no la de ejemplo de la imagen)
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "10.10.10.20:12345:12345"   # métricas de Alloy para Prometheus, solo en gestion
    volumes:
      - ../alloy/journal.alloy:/etc/alloy/isp-radius/journal.alloy:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy-data:/var/lib/alloy/data

volumes:
  alloy-data:
  pgdata:

# Red interna con rango fijo: pg_hba.conf deja entrar al exporter solo desde acá.
networks:
  interna:
    ipam:
      config:
        - subnet: 172.30.20.0/24

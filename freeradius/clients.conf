# Clientes RADIUS (NAS) autorizados.
# FreeRADIUS identifica a cada cliente por IP de origen + shared secret.
# Los secretos vienen de variables de entorno (freeradius/.env).

# R1, el MikroTik que hace de servidor PPPoE
client r1 {
    ipaddr    = 10.10.10.1
    secret    = $ENV{RADIUS_SECRET_R1}
    shortname = r1
}

# Para probar con radtest desde la propia VM: los paquetes que salen del host
# hacia el contenedor llegan con IP de origen de la red de Docker, no 127.0.0.1
client dockernet {
    ipaddr = 172.16.0.0/12
    secret = $ENV{RADIUS_SECRET_LOCAL}
}

# Facturación (job en la VM db): puede pedir CoA / Disconnect.
# Secret propio, distinto del de R1.
client facturacion {
    ipaddr    = 10.10.10.20
    secret    = $ENV{RADIUS_SECRET_FACTURACION}
    shortname = facturacion
}

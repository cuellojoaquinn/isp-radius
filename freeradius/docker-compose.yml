services:
  freeradius:
    image: freeradius/freeradius-server:latest-3.2
    container_name: freeradius
    restart: unless-stopped
    # Sin -X (debug): -X imprime la contraseña de la base y ~3700 líneas por login.
    # -f primer plano, -l stdout log a la salida -> journal -> Loki.
    # Para depurar: ver la cabecera de radiusd.conf.
    command: -f -l stdout
    env_file: .env             # secretos: ver .env.example
    ports:
      - "1812:1812/udp"        # autenticación
      - "1813:1813/udp"        # accounting
      - "3799:3799/udp"        # órdenes CoA / Disconnect (de facturación)
    volumes:
      - ./radiusd.conf:/etc/raddb/radiusd.conf:ro      # log: auth = yes, sin contraseñas
      - ./clients.conf:/etc/raddb/clients.conf:ro
      - ./authorize:/etc/raddb/mods-config/files/authorize:ro
      - ./sql:/etc/raddb/mods-enabled/sql:ro
      - ./coa:/etc/raddb/sites-enabled/coa:ro
      - ./proxy.conf:/etc/raddb/proxy.conf:ro
      - ./status:/etc/raddb/sites-enabled/status:ro   # estadísticas para el exporter
    networks: [interna]

  # Estadísticas del servidor (Status-Server) para Prometheus (VM grafana).
  # Le pregunta a freeradius:18121 por la red interna; ese puerto no se publica.
  freeradius-exporter:
    build: ./exporter
    image: isp-radius/freeradius-exporter:0.2.0
    container_name: freeradius-exporter
    restart: unless-stopped
    depends_on: [freeradius]
    environment:
      RADIUS_ADDRESS: freeradius:18121
      RADIUS_SECRET: ${RADIUS_STATUS_SECRET}   # de freeradius/.env
    ports:
      - "10.10.10.10:9812:9812"   # solo en gestion
    networks: [interna]

  # Recursos de la VM. Lo lee Prometheus (VM grafana).
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=10.10.10.10:9100   # solo en gestion
      # /vagrant es la carpeta compartida con la computadora (no el disco de la VM) y Vagrant
      # la monta dos veces: sin esto node-exporter da error en cada consulta (bitácora 26/11).
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run/credentials/.+|sys|vagrant|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)
    volumes:
      - /:/host:ro,rslave

  # Logs de esta VM (contenedores y sistema) hacia Loki. Lee el journal en solo
  # lectura, sin socket de Docker. Config compartida: alloy/journal.alloy.
  alloy:
    image: grafana/alloy:v1.21.3
    container_name: alloy
    restart: unless-stopped
    user: "473:473"            # usuario alloy de la imagen, no root
    group_add: ["999"]         # systemd-journal en Debian: permiso para leer el journal
    environment:
      INSTANCE: freeradius           # mismas etiquetas que en Prometheus
      SERVICE: radius
    command:
      - run
      - /etc/alloy/isp-radius   # solo nuestra config (no la de ejemplo de la imagen)
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "10.10.10.10:12345:12345"   # métricas de Alloy para Prometheus, solo en gestion
    volumes:
      - ../alloy/journal.alloy:/etc/alloy/isp-radius/journal.alloy:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy-data:/var/lib/alloy/data

# Red interna con rango fijo: el client "exporter" del virtual server status
# (freeradius/status) solo acepta este rango.
networks:
  interna:
    ipam:
      config:
        - subnet: 172.30.10.0/24

volumes:
  alloy-data:

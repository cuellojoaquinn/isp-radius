# Alertmanager — qué hacer con las alertas que disparan Prometheus (métricas) y
# Loki (logs, grafana/loki/rules/).
#
# Avisos (bitácora 26/11):
#   page   -> Telegram + agente de diagnóstico (diagnostico/: investiga y manda su
#             diagnóstico al mismo chat)
#   ticket -> Telegram
# Telegram se activa solo si existen grafana/alertmanager/secretos/telegram_token y
# telegram_chat_id (scripts/configurar-avisos.sh): arrancar.sh descomenta las líneas
# "#TG " al iniciar el contenedor. Sin esos archivos, las alertas se ven en
# http://localhost:9093 y en Grafana, y el agente deja su diagnóstico en el log.
# Después de cambiar este archivo: docker restart alertmanager (no alcanza /-/reload).

route:
  receiver: ninguno
  group_by: [service, alertname]   # una caída = un aviso por servicio, no uno por serie
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # page: alguien tiene que actuar ya (síntoma de usuario o monitoreo ciego)
    - matchers: [severity="page"]
      receiver: page
      repeat_interval: 1h
    # ticket: hay que mirarlo en horario laboral (presupuesto quemándose lento, saturación)
    - matchers: [severity="ticket"]
      receiver: ticket
      repeat_interval: 12h

inhibit_rules:
  # Si ya hay un page por un SLO, callar el ticket del mismo SLO (es el mismo problema).
  - source_matchers: [severity="page"]
    target_matchers: [severity="ticket"]
    equal: [slo]

  # Si se cayó una VM entera (su node-exporter), callar las demás caídas de esa VM:
  # llega un solo aviso con la causa probable, no uno por exporter.
  - source_matchers: [alertname="TargetCaido", job="node"]
    target_matchers: [alertname="TargetCaido"]
    equal: [instance]

  # Si r1-exporter no puede leer R1, los SLI 1 y 2 no tienen datos nuevos:
  # no avisar además por el target de mktxp (mismo origen: R1).
  - source_matchers: [alertname="R1SinAcceso"]
    target_matchers: [alertname="TargetCaido", instance="r1"]

  # FreeRADIUS sin base (sale del log): los timeouts de accounting que ve R1 y
  # queman los SLO son el mismo problema. Un aviso, con la causa probable.
  - source_matchers: [alertname="FreeradiusSinBase"]
    target_matchers: [alertname=~"Autenticacion.*"]
    equal: [service]

  # VM db caída: las alertas de facturación (no corre, falla) son consecuencia.
  - source_matchers: [alertname="TargetCaido", job="node"]
    target_matchers: [service="facturacion"]
    equal: [instance]

templates:
  - /etc/alertmanager/telegram.tmpl

receivers:
  - name: ninguno

  - name: page
    webhook_configs:
      - url: http://diagnostico:8080/alerta     # agente de diagnóstico (diagnostico/)
        send_resolved: false
        timeout: 10s
#TG     telegram_configs:
#TG       - bot_token_file: /etc/alertmanager/secretos/telegram_token
#TG         chat_id: __TELEGRAM_CHAT_ID__
#TG         parse_mode: HTML
#TG         message: '{{ template "telegram.mensaje" . }}'
#TG         send_resolved: true

  - name: ticket
#TG     telegram_configs:
#TG       - bot_token_file: /etc/alertmanager/secretos/telegram_token
#TG         chat_id: __TELEGRAM_CHAT_ID__
#TG         parse_mode: HTML
#TG         message: '{{ template "telegram.mensaje" . }}'
#TG         send_resolved: true

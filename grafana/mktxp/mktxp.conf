# mktxp — métricas generales de R1 por la API de RouterOS (8728).
# Plantilla: al arrancar, el contenedor reemplaza __R1_API_PASSWORD__ con el valor
# de grafana/.env (ver docker-compose.yml). La contraseña no queda en el repo.
#
# mktxp NO trae colectores de RADIUS ni de PPP: eso lo cubre r1-exporter/.

[R1]
    hostname = 10.10.10.1
    username = monitor
    password = __R1_API_PASSWORD__

[default]
    enabled = True
    module_only = False
    probe_allowed_targets = None
    hostname = localhost
    port = 8728
    username = username
    password = password
    credentials_file = ""
    custom_labels = None

    use_ssl = False
    no_ssl_certificate = False
    ssl_certificate_verify = False
    ssl_check_hostname = True
    ssl_ca_file = ""
    plaintext_login = True

    # --- Lo que usa el dashboard (bitácora 18/11: MikroTik como servidor PPPoE y como equipo)
    interface = True                # tráfico y errores por interfaz, incluidas las <pppoe-...>
    pool = True                     # saturación: direcciones usadas / total de pool-pppoe
    queue = True                    # colas dinámicas por abonado (Mikrotik-Rate-Limit)
    dhcp = True
    dhcp_lease = True

    # --- Apagado: no aplica a un CHR o no lo usamos
    health = False
    installed_packages = False
    connections = False
    connection_stats = False
    connection_stats_destinations = False
    interface_with_default_name = False
    routerboard = False
    wireguard_peers = False
    bridge_vlan = False
    route = False
    firewall = False
    neighbor = False
    address_list = None
    address_list_entries = True
    total_address_list_counts = True
    dns = False
    ipv6_route = False
    ipv6_pool = False
    ipv6_firewall = False
    ipv6_neighbor = False
    ipv6_address_list = None
    ipv6_address_list_entries = True
    ipv6_total_address_list_counts = True
    poe = False
    monitor = False
    netwatch = False
    public_ip = False
    wireless = False
    wireless_clients = False
    capsman = False
    capsman_clients = False
    w60g = False
    eoip = False
    gre = False
    ipip = False
    lte = False
    ipsec = False
    switch_port = False
    kid_control_assigned = False
    kid_control_dynamic = False
    user = False
    bfd = False
    bgp = False
    routing_stats = False
    certificate = False
    container = False
    remote_dhcp_entry = None
    remote_capsman_entry = None
    interface_name_format = name
    check_for_updates = False
    rsc_ssh_port = None
    rsc_ssh_user = None

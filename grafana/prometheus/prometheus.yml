# Prometheus — qué se recolecta y adónde van las alertas.
#
# Etiquetas comunes (las mismas que usará Loki a futuro, para cruzar métricas y logs):
#   instance  nombre de la máquina: db, freeradius, grafana, r1
#   service   a qué parte del servicio pertenece: db, radius, pppoe, monitoreo

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Recursos de cada VM (CPU, memoria, disco, red)
  - job_name: node
    static_configs:
      - targets: ["10.10.10.10:9100"]
        labels: { instance: freeradius, service: radius }
      - targets: ["10.10.10.20:9100"]
        labels: { instance: db, service: db }
      - targets: ["10.10.10.30:9100"]
        labels: { instance: grafana, service: monitoreo }

  # PostgreSQL: estadísticas del servidor + consultas propias (SLI 3 y 4)
  - job_name: postgres
    static_configs:
      - targets: ["10.10.10.20:9187"]
        labels: { instance: db, service: db }

  # FreeRADIUS visto desde el servidor (Status-Server): lo que recibió y respondió
  - job_name: freeradius
    static_configs:
      - targets: ["10.10.10.10:9812"]
        labels: { instance: freeradius, service: radius }

  # R1 como equipo y servidor PPPoE: CPU, memoria, interfaces, pool, colas (mktxp)
  - job_name: r1-mktxp
    static_configs:
      - targets: ["mktxp:49090"]
        labels: { instance: r1, service: pppoe }

  # R1 como cliente RADIUS (/radius monitor -> SLI 1 y 2) y sesiones PPP activas
  - job_name: r1-radius
    static_configs:
      - targets: ["r1-exporter:9437"]
        labels: { instance: r1, service: radius }

  # El propio stack de monitoreo
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: { instance: grafana, service: monitoreo }

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels: { instance: grafana, service: monitoreo }

  # Loki también expone métricas (ingesta, errores): si se cae, TargetCaido avisa
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels: { instance: grafana, service: monitoreo }

  # Alloy de cada VM: si se cae, los logs de esa VM dejan de llegar sin ruido
  - job_name: alloy
    static_configs:
      - targets: ["10.10.10.10:12345"]
        labels: { instance: freeradius, service: radius }
      - targets: ["10.10.10.20:12345"]
        labels: { instance: db, service: db }
      - targets: ["10.10.10.30:12345"]
        labels: { instance: grafana, service: monitoreo }

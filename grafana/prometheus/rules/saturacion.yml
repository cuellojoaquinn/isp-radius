# Saturación antes del borde (bitácora 18/11): quedarse sin disco, sin conexiones
# o sin IPs no da síntomas hasta que es tarde, así que se avisa al 80 %.
groups:
  - name: saturacion
    rules:
      - alert: DiscoCasiLleno
        expr: |
          1 - node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"}
            / node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"} > 0.8
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "Disco de {{ $labels.instance }} al {{ $value | humanizePercentage }}"
          description: "Al llenarse, PostgreSQL deja de aceptar escrituras (accounting) y Docker no puede escribir logs."
          runbook: >-
            1) vagrant ssh {{ $labels.instance }} -c 'df -h /; docker system df'.
            2) En db: tamaño de radacct (dashboard PostgreSQL). Definir retención del accounting.
            3) Logs de contenedores: FreeRADIUS en -X genera mucho log.

      - alert: PostgresConexionesAltas
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels: { severity: ticket, service: db }
        annotations:
          summary: "PostgreSQL usa {{ $value | humanizePercentage }} de max_connections"
          description: "Si se llega al máximo, FreeRADIUS no puede abrir conexiones: los logins fallan (SLI 1)."
          runbook: >-
            Dashboard PostgreSQL: conexiones por usuario y estado. Muchas "idle" de radius -> revisar el pool
            del módulo sql (freeradius/sql, sección pool). Muchas "active" -> consultas lentas o bloqueos.

      - alert: PoolPppoeCasiAgotado
        expr: mktxp_ip_pool_used{pool="pool-pppoe"} / mktxp_ip_pool_total{pool="pool-pppoe"} > 0.8
        for: 5m
        labels: { severity: ticket, service: pppoe }
        annotations:
          summary: "pool-pppoe de R1 al {{ $value | humanizePercentage }}"
          description: "Sin IPs libres, el abonado se autentica (Access-Accept) pero falla en IPCP y no navega."
          runbook: "Ampliar pool-pppoe en R1 (/ip pool) o agregar un rango. Revisar sesiones colgadas (/ppp active)."

# SLIs, SLOs y alertas por síntoma (bitácora 18/11, SRE de Google).
#
# SLI 1  disponibilidad de autenticación  (accepts + rejects) / requests     SLO 99,9 %
# SLI 2  latencia por política            1 - resends / requests            SLO 99 %
# SLI 3  estabilidad de sesiones          cortes normales / cortes totales  (solo dashboard)
# SLI 4  frescura del accounting          sesiones frescas / abiertas       SLO 99 %
#
# Fuentes: SLI 1 y 2 salen de /radius monitor de R1 (r1-exporter); SLI 3 y 4 de
# radacct (postgres-exporter, db/exporter/queries.yml).
#
# Ojo: /radius monitor de MikroTik cuenta también el accounting: "requests" incluye
# Accounting-Request y "accepts" sus respuestas (verificado: una reconexión suma 3,
# Stop + Access-Request + Start). Para el SLI 1 está bien: un accounting sin respuesta
# también es el servicio fallando.
#
# Alertas por tasa de quema multiventana (SRE workbook, "Alerting on SLOs"):
#   tasa de quema = proporción de errores / presupuesto (1 - SLO)
#   page    tasa > 14,4 en 1 h y en 5 min   -> 2 % del presupuesto de 30 días en 1 h
#   ticket  tasa > 6    en 6 h y en 30 min  -> 5 % del presupuesto en 6 h
#   La ventana corta hace que la alerta se apague apenas se resuelve el problema.
#
# Con poco tráfico (laboratorio) una ventana sin pedidos da NaN y la alerta no
# dispara: no hay pedidos fallando, no hay síntoma.
#
# Punto ciego del SLI 1: con PostgreSQL caído FreeRADIUS no deja de responder,
# rechaza a todos (Invalid user -> Access-Reject) y un reject cuenta como respuesta.
# Lo cubre la alerta FreeradiusSinBase, que sale del log (grafana/loki/rules/).

groups:
  # ---------------------------------------------------------------- SLIs
  - name: sli
    rules:
      # Proporción de errores de autenticación (1 - SLI 1) por ventana
      - record: slo:radius_auth_errores:ratio_rate5m
        expr: 1 - (sum(increase(routeros_radius_accepts_total[5m])) + sum(increase(routeros_radius_rejects_total[5m]))) / sum(increase(routeros_radius_requests_total[5m]))
      - record: slo:radius_auth_errores:ratio_rate30m
        expr: 1 - (sum(increase(routeros_radius_accepts_total[30m])) + sum(increase(routeros_radius_rejects_total[30m]))) / sum(increase(routeros_radius_requests_total[30m]))
      - record: slo:radius_auth_errores:ratio_rate1h
        expr: 1 - (sum(increase(routeros_radius_accepts_total[1h])) + sum(increase(routeros_radius_rejects_total[1h]))) / sum(increase(routeros_radius_requests_total[1h]))
      - record: slo:radius_auth_errores:ratio_rate6h
        expr: 1 - (sum(increase(routeros_radius_accepts_total[6h])) + sum(increase(routeros_radius_rejects_total[6h]))) / sum(increase(routeros_radius_requests_total[6h]))
      - record: slo:radius_auth_errores:ratio_rate30d
        expr: 1 - (sum(increase(routeros_radius_accepts_total[30d])) + sum(increase(routeros_radius_rejects_total[30d]))) / sum(increase(routeros_radius_requests_total[30d]))

      # Proporción de pedidos con reenvío (1 - SLI 2) por ventana
      - record: slo:radius_auth_reenvios:ratio_rate5m
        expr: sum(increase(routeros_radius_resends_total[5m])) / sum(increase(routeros_radius_requests_total[5m]))
      - record: slo:radius_auth_reenvios:ratio_rate30m
        expr: sum(increase(routeros_radius_resends_total[30m])) / sum(increase(routeros_radius_requests_total[30m]))
      - record: slo:radius_auth_reenvios:ratio_rate1h
        expr: sum(increase(routeros_radius_resends_total[1h])) / sum(increase(routeros_radius_requests_total[1h]))
      - record: slo:radius_auth_reenvios:ratio_rate6h
        expr: sum(increase(routeros_radius_resends_total[6h])) / sum(increase(routeros_radius_requests_total[6h]))
      - record: slo:radius_auth_reenvios:ratio_rate30d
        expr: sum(increase(routeros_radius_resends_total[30d])) / sum(increase(routeros_radius_requests_total[30d]))

      # SLI 3: proporción de cortes normales
      - record: sli:radius_sesiones_estables:ratio_rate1h
        expr: sum(increase(radius_sesiones_cerradas_total{tipo="normal"}[1h])) / sum(increase(radius_sesiones_cerradas_total[1h]))
      - record: sli:radius_sesiones_estables:ratio_rate24h
        expr: sum(increase(radius_sesiones_cerradas_total{tipo="normal"}[24h])) / sum(increase(radius_sesiones_cerradas_total[24h]))

      # SLI 4: frescura del accounting (sin sesiones abiertas no hay dato)
      - record: sli:radius_accounting_fresco:ratio
        expr: radius_sesiones_activas_frescas / (radius_sesiones_activas_total > 0)

  # ---------------------------------------------------------------- alertas por síntoma
  - name: slo-alertas
    rules:
      # SLI 1 — presupuesto: 1 - 0,999 = 0,001
      - alert: AutenticacionQuemaRapida
        expr: |
          slo:radius_auth_errores:ratio_rate1h > (14.4 * 0.001)
          and
          slo:radius_auth_errores:ratio_rate5m > (14.4 * 0.001)
        for: 2m
        labels: { severity: page, service: radius, slo: disponibilidad }
        annotations:
          summary: "Los abonados no se pueden autenticar ({{ $value | humanizePercentage }} de pedidos sin respuesta en 1 h)"
          description: "SLI 1 por debajo del SLO 99,9 %: a este ritmo el presupuesto de error del mes se agota en menos de 2 días."
          runbook: >-
            Síntoma: R1 manda pedidos y no recibe respuesta. Cruzar en el dashboard "Componentes":
            1) routeros_radius_timeouts sube y freeradius_total_access_requests NO sube -> no llega al servidor.
               Si freeradius_up == 0, FreeRADIUS está caído (docker ps en la VM freeradius);
               si freeradius_up == 1, es la red de gestión o un firewall (ping 10.10.10.10 desde R1).
            2) routeros_radius_bad_replies sube -> el servidor responde pero R1 descarta: shared secret distinto
               (/radius en R1 vs RADIUS_SECRET_R1 en freeradius/.env).
            3) FreeRADIUS recibe y descarta (freeradius_total_auth_dropped_requests) o no responde -> el servidor
               o la base: radius:sql_errores:rate5m > 0 (sale del log, ver FreeradiusSinBase); ¿PostgreSQL arriba? (pg_up).
            Los abonados ya conectados siguen funcionando; los nuevos no entran (bitácora 19/11).

      - alert: AutenticacionQuemaLenta
        expr: |
          slo:radius_auth_errores:ratio_rate6h > (6 * 0.001)
          and
          slo:radius_auth_errores:ratio_rate30m > (6 * 0.001)
        for: 15m
        labels: { severity: ticket, service: radius, slo: disponibilidad }
        annotations:
          summary: "Fallas intermitentes de autenticación ({{ $value | humanizePercentage }} en 30 min)"
          description: "SLI 1 consume el presupuesto 6 veces más rápido de lo permitido: se agota en unos 5 días."
          runbook: "Mismo diagnóstico que AutenticacionQuemaRapida. Buscar patrones horarios en el dashboard de SLOs."

      # SLI 2 — presupuesto: 1 - 0,99 = 0,01
      - alert: AutenticacionLentaQuemaRapida
        expr: |
          slo:radius_auth_reenvios:ratio_rate1h > (14.4 * 0.01)
          and
          slo:radius_auth_reenvios:ratio_rate5m > (14.4 * 0.01)
        for: 2m
        labels: { severity: page, service: radius, slo: latencia }
        annotations:
          summary: "R1 reenvía {{ $value | humanizePercentage }} de los pedidos RADIUS (respuestas más lentas que el timeout)"
          description: "SLI 2 por debajo del SLO 99 %. Cada reenvío es una respuesta que tardó más que el timeout del NAS (3 s)."
          runbook: >-
            1) ¿La base está lenta? Dashboard PostgreSQL: consulta activa más larga, bloqueos, conexiones.
            2) ¿FreeRADIUS saturado? freeradius_queue_len_auth, freeradius_outstanding_requests.
            3) RTT: routeros_radius_last_request_rtt_seconds (muestra suelta, solo referencia).
            Si el servidor está sano pero la red tiene RTT alto, evaluar subir timeout en /radius de R1.

      - alert: AutenticacionLentaQuemaLenta
        expr: |
          slo:radius_auth_reenvios:ratio_rate6h > (6 * 0.01)
          and
          slo:radius_auth_reenvios:ratio_rate30m > (6 * 0.01)
        for: 15m
        labels: { severity: ticket, service: radius, slo: latencia }
        annotations:
          summary: "Reenvíos RADIUS sostenidos ({{ $value | humanizePercentage }} en 30 min)"
          description: "SLI 2 consume el presupuesto 6 veces más rápido de lo permitido."
          runbook: "Mismo diagnóstico que AutenticacionLentaQuemaRapida."

      # SLI 4 — gauge, no contador: se alerta cuando la proporción queda por debajo del SLO
      - alert: AccountingDesactualizado
        expr: sli:radius_accounting_fresco:ratio < 0.99
        for: 15m
        labels: { severity: page, service: radius, slo: frescura }
        annotations:
          summary: "{{ $value | humanizePercentage }} de las sesiones abiertas tiene accounting reciente"
          description: "Hay sesiones abiertas en radacct sin Start/Interim en los últimos 11 min (Interim cada 5 min). El consumo que muestra Grafana está atrasado."
          runbook: >-
            1) ¿Llegan Accounting-Request al servidor? freeradius_total_acct_requests.
            2) Si llegan, ¿la base acepta escrituras? Dashboard PostgreSQL (escrituras en radacct, rollbacks).
            3) Si no llegan: ¿/ppp aaa de R1 tiene interim-update=5m y accounting=yes?
            4) Sesiones fantasma: un NAS reiniciado sin Stop deja filas abiertas para siempre;
               R1 manda Accounting-On al arrancar para cerrarlas.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s          # igual al scrape_interval
      alertmanagerUid: alertmanager

  # Detalle de sesiones y logins (tablas). Usuario de solo lectura, sin radcheck.
  - name: PostgreSQL radius
    uid: postgres-radius
    type: grafana-postgresql-datasource
    access: proxy
    url: 10.10.10.20:5432
    user: grafana
    jsonData:
      database: radius
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 5
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD   # de grafana/.env

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false   # las alertas las evalúa Prometheus, no Grafana

  # Logs de todas las VMs y de R1 (Loki en esta misma VM)
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # El usuario de cada "Login OK / Login incorrect" de FreeRADIUS es un link a su ficha
      # (en Logins en vivo y en cualquier panel de logs: abrir la línea y click en Abonado).
      derivedFields:
        - name: Abonado
          matcherRegex: 'Login (?:OK|incorrect.*?): \[([^\]]+)\]'
          # $$ = $ literal: al leer este archivo Grafana reemplaza ${...} por variables de entorno
          url: '/d/ficha-abonado?var-abonado=$${__value.raw}'
          urlDisplayLabel: 'Ver la ficha de $${__value.raw}'
